<dialog
  #dialog
  [attr.aria-labelledby]="title() ? 'modal-title' : null"
  (click)="onBackdrop($event)"
  (keydown)="onKey($event)">
  <div class="modal-content">
    @if (title()) {
      <h5 id="modal-title">{{ title() }}</h5>
    }
    <ng-content select="[modalBody]"></ng-content>
    <footer class="modal-footer">
      <app-button buttonTitle="Voltar" styleButton="secondary" size="modal" (buttonAction)="onCancel()"></app-button>
      <app-button
        buttonTitle="Excluir"
        styleButton="primary"
        size="modal"
        [isDisabled]="loading()"
        (buttonAction)="onConfirm()">
      </app-button>
    </footer>
  </div>
</dialog>
