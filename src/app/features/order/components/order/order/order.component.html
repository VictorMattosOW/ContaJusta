<main class="content">
  @if (isDeleteModalOpen()) {
    <app-modal
      [(open)]="isDeleteModalOpen"
      title="Excluir item"
      confirmText="Excluir"
      cancelText="Voltar"
      (confirm)="confirmDelete()"
      (cancel)="onModalDismiss()">
      <div modalBody>
        <h5>Tem certeza que deseja excluir o item {{ orderToDelete()?.name }}?</h5>
        <legend>Se excluir, esse item não entrará na conta, ok?</legend>
      </div>
    </app-modal>
  }

  <article>
    <header class="title">
      @if (isEdit()) {
        <h1 class="primary">Modificar item</h1>
      }
      @if (!isEdit()) {
        <div>
          <h1 class="primary">O que pediram ?</h1>
          <p>Adicione item por item</p>
        </div>
      }
    </header>

    <app-card-orders [orders]="getOrder" (orderToDelete)="requestDelete($event)" />

    <app-order-form [orderForm]="orderForm">
      <app-user-checkbox
        [usersList]="usersList()"
        (selectedUserList)="getSharedUserFood($event)"
        [resetTrigger]="resetCheckbox()" />
    </app-order-form>
  </article>
  @if (!isEdit()) {
    <footer class="btn-content">
      <app-button
        [buttonTitle]="getOrder.length >= 1 ? 'próximo item' : 'incluir item'"
        styleButton="primary"
        size="large"
        [isDisabled]="!isSubmitButton() || !hasUserSelected"
        (buttonAction)="createOrder()"></app-button>
      <app-button-link title="Finalizar pedidos >" (buttonAction)="goToSummary()"></app-button-link>
    </footer>
  }

  @if (isEdit()) {
    <footer class="btn-content-edit">
      <app-button buttonTitle="voltar" styleButton="secondary" size="small" (buttonAction)="navigateTo()"></app-button>
      <app-button
        buttonTitle="salvar"
        styleButton="primary"
        size="small"
        [isDisabled]="!isSubmitButton || !hasUserSelected"
        (buttonAction)="editOrder()"></app-button>
    </footer>
  }
</main>
