name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    name: 'Build anb Push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - run: npm
      - run: npm run test
