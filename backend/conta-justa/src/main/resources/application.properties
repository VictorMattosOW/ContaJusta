spring.application.name=conta-justa

# 1. Conexão JDBC (Em memória simulando PostgreSQL)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. Ativar o console web para você visualizar os dados
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 3. Inicialização do Banco (Essencial para JDBC puro)
# Sempre inicializa o banco com os scripts SQL fornecidos
spring.sql.init.mode=always

# JWT
app.jwt.secret=segredo-super-secreto-para-dev-conta-justa-2026-mude-em-producao-0123456789
app.jwt.expiration=3600000

spring.mvc.problemdetails.enabled=true

# Logging (formatação em logback-spring.xml)
# Níveis por pacote — ajuste aqui para depurar sem recriar o XML
logging.level.com.example.conta_justa=DEBUG
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.web=WARN
logging.level.com.zaxxer.hikari=WARN
